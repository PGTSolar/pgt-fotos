<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E4D2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PGS Fotos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>PGS Fotos (teste de envio)</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Arial,sans-serif;background:#f4f8f5;color:#1b2b22}
header{background:#0E4D2E;color:#fff;padding:18px 16px}
header h1{margin:0;font-size:20px}header p{margin:4px 0 0;font-size:13px;opacity:.85}
main{padding:16px;max-width:560px;margin:0 auto}
.card{background:#fff;border:1px solid #d6e6dc;border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{margin:0 0 8px;font-size:16px}
label.btn,button{display:block;width:100%;text-align:center;background:#2FA36B;color:#fff;font-weight:700;padding:16px;border-radius:12px;font-size:17px;border:0}
button:disabled{background:#9db8a9}
input[type=file]{display:none}
input[type=password],input[type=text]{width:100%;padding:12px;font-size:17px;border:1px solid #bcd3c4;border-radius:10px}
ul{list-style:none;padding:0;margin:10px 0 0;font-size:13px}
li{padding:6px 0;border-top:1px solid #eef3ef;word-break:break-all}
.ok{color:#166534;font-weight:700}.err{color:#b91c1c;font-weight:700}
.bar{height:12px;background:#e5efe8;border-radius:6px;overflow:hidden;margin-top:8px}
.bar div{height:100%;width:0;background:#2FA36B}
</style>
</head>
<body>
<header><h1>PGS Fotos</h1><p>Teste de envio para a pasta TESTE APP FOTOS</p></header>
<main>
<div class="card">
<h2>1. PIN</h2>
<input id="pin" type="password" inputmode="numeric" placeholder="Digite o PIN">
</div>
<div class="card">
<h2>2. Fotos</h2>
<label class="btn" for="pick">Escolher fotos da galeria</label>
<input id="pick" type="file" accept="image/*" multiple>
<p><b id="count">0</b> fotos escolhidas</p>
</div>
<div class="card">
<h2>3. Enviar</h2>
<button id="go" disabled>Enviar</button>
<p id="prog"></p>
<div class="bar"><div id="barin"></div></div>
<ul id="log"></ul>
</div>
</main>
<script>
// >>> TROQUE a linha abaixo pelo endereço do seu servidor (Etapa B) <<<
const WORKER_URL = "https://pgs-fotos.weathered-thunder-7245.workers.dev";
const FOLDER_ID  = "15VbAM5GbktL8RBNE_1z-kU9Oaxs926pu";

const $=id=>document.getElementById(id);
let files=[];
try{$('pin').value=localStorage.getItem('pgs_pin')||''}catch(e){}
$('pick').addEventListener('change',e=>{files=[...e.target.files];$('count').textContent=files.length;$('go').disabled=!files.length;});

function log(t,cls){const li=document.createElement('li');li.textContent=t;if(cls)li.className=cls;$('log').prepend(li);}
function put(url,file){return new Promise((res,rej)=>{
  const x=new XMLHttpRequest();x.open('PUT',url);x.setRequestHeader('Content-Type',file.type||'image/jpeg');
  x.onload=()=>x.status>=200&&x.status<300?res():rej(new Error('Google respondeu '+x.status));
  x.onerror=()=>rej(new Error('Falha de rede'));x.send(file);});}
async function sendOne(f,i){
  const stamp=new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
  const name=stamp+'_'+String(i+1).padStart(3,'0')+'_'+f.name;
  const r=await fetch(WORKER_URL+'/upload-session',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({pin:$('pin').value,folderId:FOLDER_ID,fileName:name,mimeType:f.type||'image/jpeg',size:f.size})});
  const j=await r.json();if(!r.ok)throw new Error(j.error||('Erro '+r.status));
  await put(j.uploadUrl,f);
}
$('go').addEventListener('click',async()=>{
  try{localStorage.setItem('pgs_pin',$('pin').value)}catch(e){}
  $('go').disabled=true;let okc=0;
  for(let i=0;i<files.length;i++){
    $('prog').textContent=(i+1)+' de '+files.length+' enviando...';
    let done=false,tries=0,lastErr='';
    while(!done&&tries<3){try{await sendOne(files[i],i);done=true;}catch(e){lastErr=e.message;tries++;if(e.message==='PIN inválido')break;}}
    if(done){okc++;log('OK: '+files[i].name+' ('+(files[i].size/1048576).toFixed(1)+' MB, '+files[i].type+')','ok');}
    else log('ERRO: '+files[i].name+' | '+lastErr,'err');
    $('barin').style.width=((i+1)/files.length*100)+'%';
  }
  $('prog').textContent=okc+' de '+files.length+' enviadas';
  $('go').disabled=false;
});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
</html>
